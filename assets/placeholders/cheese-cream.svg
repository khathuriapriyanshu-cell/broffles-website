<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="creamBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFDF8"/>
      <stop offset="100%" stop-color="#F7EEDF"/>
    </linearGradient>
    <linearGradient id="topWaffle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FCD698"/>
      <stop offset="100%" stop-color="#DE9D4B"/>
    </linearGradient>
    <linearGradient id="creamFilling" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFF5E5"/>
    </linearGradient>
    <linearGradient id="berryDrip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E84A6A"/>
      <stop offset="100%" stop-color="#AF1A39"/>
    </linearGradient>
    <filter id="creamShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#552B11" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect width="400" height="300" fill="url(#creamBg)"/>
  
  <g opacity="0.08" stroke="#8C5123" stroke-width="1.5">
    <path d="M0,50 H400 M0,100 H400 M0,150 H400 M0,200 H400 M0,250 H400"/>
    <path d="M50,0 V300 M100,0 V300 M150,0 V300 M200,0 V300 M250,0 V300 M300,0 V300 M350,0 V300"/>
  </g>

  <ellipse cx="200" cy="225" rx="145" ry="24" fill="#6A3616" opacity="0.15" filter="blur(8px)"/>

  <!-- Cheese Cream Waffle Sandwich (isometric angle matching menu photo) -->
  <g filter="url(#creamShadow)">
    <!-- Bottom Waffle Layer -->
    <path d="M110,165 L250,135 L290,160 L150,195 Z" fill="#BF7A2C" stroke="#8A4E12" stroke-width="2"/>
    <path d="M110,165 L110,182 L150,212 L150,195 Z" fill="#8A4E12"/>
    <path d="M150,195 L150,212 L290,177 L290,160 Z" fill="#A5631C"/>

    <!-- Thick Cream Cheese Filling Layer with Berry Swirl -->
    <path d="M106,145 L248,118 L294,142 L148,175 Z" fill="url(#creamFilling)" stroke="#F0DFC7" stroke-width="1.5"/>
    <path d="M106,145 L106,168 L148,198 L148,175 Z" fill="#FCF8EE"/>
    <path d="M148,175 L148,198 L294,163 L294,142 Z" fill="#EDE1CD"/>
    
    <!-- Berry Jam Ribbons oozing from cream layer -->
    <path d="M115,160 Q130,165 145,172" stroke="url(#berryDrip)" stroke-width="4" stroke-linecap="round"/>
    <path d="M165,182 Q195,190 225,178" stroke="url(#berryDrip)" stroke-width="5" stroke-linecap="round"/>
    <path d="M245,172 Q270,166 288,155" stroke="url(#berryDrip)" stroke-width="4" stroke-linecap="round"/>
    <circle cx="185" cy="188" r="4" fill="#AF1A39"/>
    <circle cx="210" cy="184" r="3" fill="#E84A6A"/>

    <!-- Top Waffle Layer -->
    <path d="M105,115 L245,88 L285,112 L145,145 Z" fill="url(#topWaffle)" stroke="#9F652B" stroke-width="2.5"/>
    <path d="M105,115 L105,130 L145,160 L145,145 Z" fill="#9F652B"/>
    <path d="M145,145 L145,160 L285,127 L285,112 Z" fill="#C58133"/>

    <!-- Top Waffle Grid Pattern (Perspective) -->
    <g fill="#B8772C" opacity="0.65">
      <polygon points="125,120 150,115 156,121 131,127"/>
      <polygon points="160,113 185,108 191,114 166,120"/>
      <polygon points="195,106 220,101 226,107 201,113"/>
      <polygon points="230,99 255,94 261,100 236,106"/>

      <polygon points="135,129 160,124 166,130 141,136"/>
      <polygon points="170,122 195,117 201,123 176,129"/>
      <polygon points="205,115 230,110 236,116 211,122"/>
      <polygon points="240,108 265,103 271,109 246,115"/>
    </g>

    <!-- Powdered sugar dust -->
    <circle cx="160" cy="115" r="1.5" fill="#FFFFFF" opacity="0.8"/>
    <circle cx="180" cy="110" r="2" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="220" cy="105" r="1.5" fill="#FFFFFF" opacity="0.8"/>
    <circle cx="205" cy="120" r="2" fill="#FFFFFF" opacity="0.85"/>
  </g>

  <!-- Tagline Badge -->
  <g transform="translate(200, 274)" text-anchor="middle">
    <rect x="-85" y="-12" width="170" height="24" rx="12" fill="#2C1810" opacity="0.85"/>
    <text x="0" y="4" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="700" fill="#FAF5EE" letter-spacing="1">CHEESE CREAM SPECIAL</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="rvBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF5F6"/>
      <stop offset="100%" stop-color="#FCE4E8"/>
    </linearGradient>
    <radialGradient id="redVelvetBase" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#B32038"/>
      <stop offset="100%" stop-color="#6B0F20"/>
    </radialGradient>
    <linearGradient id="snowWhiteCream" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FAF0F2"/>
    </linearGradient>
    <filter id="rvShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#4C0A16" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="400" height="300" fill="url(#rvBg)"/>
  
  <g opacity="0.08" stroke="#8A1428" stroke-width="1.5">
    <path d="M0,50 H400 M0,100 H400 M0,150 H400 M0,200 H400 M0,250 H400"/>
    <path d="M50,0 V300 M100,0 V300 M150,0 V300 M200,0 V300 M250,0 V300 M300,0 V300 M350,0 V300"/>
  </g>

  <ellipse cx="200" cy="225" rx="140" ry="24" fill="#5C0D1C" opacity="0.18" filter="blur(8px)"/>

  <!-- Red Velvet Waffle Wedge with Cream Filling (matching menu photo) -->
  <g filter="url(#rvShadow)">
    <!-- Bottom Wedge -->
    <path d="M125,120 L275,100 Q285,175 195,235 Q125,185 125,120 Z" fill="url(#redVelvetBase)" stroke="#520916" stroke-width="3" stroke-linejoin="round"/>
    
    <!-- White Cream Heart / Filling -->
    <path d="M132,125 Q145,150 170,140 Q205,175 220,135 Q250,150 268,110 Q265,160 195,215 Q135,170 132,125 Z" fill="url(#snowWhiteCream)" stroke="#F8E5E9" stroke-width="1.5"/>

    <!-- Pockets on Red Velvet Waffle -->
    <g fill="#450813" opacity="0.65">
      <rect x="150" y="125" width="20" height="16" rx="3"/>
      <rect x="180" y="120" width="20" height="16" rx="3"/>
      <rect x="210" y="115" width="20" height="16" rx="3"/>
      <rect x="240" y="110" width="20" height="16" rx="3"/>

      <rect x="160" y="150" width="20" height="16" rx="3"/>
      <rect x="190" y="145" width="20" height="16" rx="3"/>
      <rect x="220" y="140" width="20" height="16" rx="3"/>

      <rect x="175" y="175" width="20" height="16" rx="3"/>
      <rect x="205" y="170" width="20" height="16" rx="3"/>
    </g>

    <!-- White Chocolate & Cream Drizzles -->
    <path d="M135,110 Q170,130 200,115 T260,125" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
    <path d="M150,140 Q185,165 215,150 T255,160" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Red Velvet Crumbs scattered -->
    <circle cx="155" cy="115" r="3" fill="#8E142B"/>
    <circle cx="215" cy="128" r="3.5" fill="#8E142B"/>
    <circle cx="185" cy="160" r="2.5" fill="#8E142B"/>
    <circle cx="235" cy="145" r="3" fill="#8E142B"/>
    <circle cx="195" cy="190" r="3" fill="#8E142B"/>
    <circle cx="210" cy="205" r="2.5" fill="#8E142B"/>
  </g>

  <!-- Tagline Badge -->
  <g transform="translate(200, 274)" text-anchor="middle">
    <rect x="-85" y="-12" width="170" height="24" rx="12" fill="#2C1810" opacity="0.85"/>
    <text x="0" y="4" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="700" fill="#FAF5EE" letter-spacing="1">RED VELVET SPECIAL</text>
  </g>
</svg>

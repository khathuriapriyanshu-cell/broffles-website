<svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" viewBox="0 0 60 60">
  <defs>
    <linearGradient id="pocketGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E8C99B" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#CA9C65" stop-opacity="0.6"/>
    </linearGradient>
  </defs>
  <!-- Background ridge color -->
  <rect width="60" height="60" fill="#F4E3C8" fill-opacity="0.25"/>
  <!-- Waffle indentations (4 per tile) -->
  <rect x="5" y="5" width="22" height="22" rx="4" fill="url(#pocketGrad)"/>
  <rect x="33" y="5" width="22" height="22" rx="4" fill="url(#pocketGrad)"/>
  <rect x="5" y="33" width="22" height="22" rx="4" fill="url(#pocketGrad)"/>
  <rect x="33" y="33" width="22" height="22" rx="4" fill="url(#pocketGrad)"/>
  
  <!-- Subtle inner shadow in each pocket -->
  <rect x="7" y="7" width="18" height="18" rx="2" fill="#B2824C" fill-opacity="0.15"/>
  <rect x="35" y="7" width="18" height="18" rx="2" fill="#B2824C" fill-opacity="0.15"/>
  <rect x="7" y="35" width="18" height="18" rx="2" fill="#B2824C" fill-opacity="0.15"/>
  <rect x="35" y="35" width="18" height="18" rx="2" fill="#B2824C" fill-opacity="0.15"/>
</svg>
